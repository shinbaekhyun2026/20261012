<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연수 퀴즈 시스템</title>
    <!-- QR 코드 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            color: var(--text-color);
            margin-top: 0;
        }

        .hidden {
            display: none !important;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .option-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 1px solid #d1d5db;
            text-align: left;
            margin-bottom: 8px;
        }

        .option-btn:hover {
            background-color: #f9fafb;
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background-color: #eef2ff;
            color: var(--primary-color);
        }

        #qr-code {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .admin-panel {
            margin-top: 30px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 이름 입력 화면 -->
    <div id="start-screen">
        <h1>연수 이수 퀴즈</h1>
        <div class="input-group">
            <label for="user-name">성함을 입력해 주세요</label>
            <input type="text" id="user-name" placeholder="홍길동" required>
        </div>
        <button id="start-btn">퀴즈 시작하기</button>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="hidden">
        <h2 id="question-text">질문 불러오는 중...</h2>
        <div id="options-container"></div>
        <button id="next-btn" class="hidden">다음 문제</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden">
        <h2>퀴즈 완료!</h2>
        <p id="score-text" style="text-align: center; font-size: 18px;"></p>
        <p style="text-align: center; color: #4b5563;">구글 설문지로 이수 기록이 전송되었습니다.</p>
        
        <div id="qr-section">
            <h3 style="text-align: center;">이수 확인 QR 코드</h3>
            <div id="qr-code"></div>
        </div>
        
        <button onclick="location.reload()">처음으로 돌아가기</button>
    </div>

    <!-- 4. 관리자 패널 -->
    <div class="admin-panel">
        <h3>관리자 기능 (로컬 백업)</h3>
        <button id="export-btn" style="background-color: #059669;">CSV 저장 기록 다운로드</button>
    </div>
</div>

<script>
    // ==========================================
    // 📌 구글 설문지(Google Form) 연동 설정
    // ==========================================
    const FORM_ID = "1HgeVhSOF87sS2nYXcT-eU-3uzy-CFiIyoPU3tiLm348";
    const ENTRY_ID = "entry.808143547";

    // 퀴즈 데이터 설정
    const quizData = [
        {
            question: "1. 연수 중 강조된 핵심 목표는 무엇일까요?",
            options: ["학생 중심 수업 구성", "시험 난이도 상향", "서류 작성 간소화", "시설 개선"],
            answer: 0
        },
        {
            question: "2. 디지털 기반 수업 활용 시 가장 유의해야 할 점은?",
            options: ["장비 가격", "디지털 윤리 및 정보 보호", "화면 크기", "네트워크 속도 단독 확인"],
            answer: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userName = "";
    let selectedOptionIndex = null;

    // DOM 요소 참조
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const userNameInput = document.getElementById('user-name');
    const startBtn = document.getElementById('start-btn');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const scoreText = document.getElementById('score-text');
    const qrCodeDiv = document.getElementById('qr-code');
    const exportBtn = document.getElementById('export-btn');

    // DOMContentLoaded 초기화
    document.addEventListener('DOMContentLoaded', () => {
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', handleNextQuestion);
        exportBtn.addEventListener('click', exportToCSV);
    });

    // 퀴즈 시작
    function startQuiz() {
        userName = userNameInput.value.trim();
        if (!userName) {
            alert('성함을 입력해 주세요.');
            return;
        }

        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        showQuestion();
    }

    // 문제 표시
    function showQuestion() {
        resetState();
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.textContent = currentQuestion.question;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.textContent = option;
            button.classList.add('option-btn');
            button.addEventListener('click', () => selectOption(button, index));
            optionsContainer.appendChild(button);
        });
    }

    function resetState() {
        selectedOptionIndex = null;
        nextBtn.classList.add('hidden');
        while (optionsContainer.firstChild) {
            optionsContainer.removeChild(optionsContainer.firstChild);
        }
    }

    // 보기 선택
    function selectOption(selectedBtn, index) {
        const buttons = optionsContainer.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));
        
        selectedBtn.classList.add('selected');
        selectedOptionIndex = index;
        nextBtn.classList.remove('hidden');
    }

    // 다음 문제 진행
    function handleNextQuestion() {
        if (selectedOptionIndex === quizData[currentQuestionIndex].answer) {
            score++;
        }

        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    // 결과 화면 출력 및 저장
    function showResult() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        scoreText.textContent = `${userName}님의 점수: ${score} / ${quizData.length}점`;

        // 구글 폼 및 로컬 저장소에 이수 기록 저장
        saveCompletionRecord(userName);

        // QR 코드 생성 (접속 URL 기반)
        qrCodeDiv.innerHTML = "";
        new QRCode(qrCodeDiv, {
            text: window.location.href,
            width: 128,
            height: 128
        });
    }

    // 📌 데이터 저장 함수 (Google Form + localStorage 백업)
    function saveCompletionRecord(name) {
        const timestamp = new Date().toLocaleString('ko-KR');

        // 1. 브라우저 내 로컬 저장소 백업
        const records = JSON.parse(localStorage.getItem('quizRecords') || '[]');
        records.push({ name: name, date: timestamp, score: score });
        localStorage.setItem('quizRecords', JSON.stringify(records));

        // 2. 구글 설문지로 서버 전송 (CORS 제약 회피를 위한 no-cors 사용)
        const formUrl = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
        const formData = new FormData();
        formData.append(ENTRY_ID, name);

        fetch(formUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        }).then(() => {
            console.log("구글 설문지에 이수 기록 저장 성공");
        }).catch(err => {
            console.error("구글 설문지 저장 오류:", err);
        });
    }

    // 로컬 백업 기록 CSV 다운로드
    function exportToCSV() {
        const records = JSON.parse(localStorage.getItem('quizRecords') || '[]');
        if (records.length === 0) {
            alert('저장된 응답 기록이 없습니다.');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF이름,제출시간,점수\n";
        records.forEach(r => {
            csvContent += `"${r.name}","${r.date}","${r.score}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "quiz_records.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
