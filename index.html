<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연수 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-image 0.5s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Admin Toolbar */
    .admin-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Progress Indicator */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--primary);
      transform: scale(1.2);
    }

    .step-dot.completed {
      background: var(--accent);
    }

    /* Card Content */
    h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    p.description {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .hint-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f59e0b;
      padding: 10px 15px;
      font-size: 0.9rem;
      color: #fde68a;
      text-align: left;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
    }

    /* Input & Button */
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-group-modal {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* Shake Animation for Wrong Answer */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: left;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .edit-group {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }

    .edit-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    th {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Admin Controls -->
  <div class="admin-bar">
    <button class="admin-btn" onclick="openModal('editModal')">⚙️ 문제 편집</button>
    <button class="admin-btn" onclick="openModal('listModal')">📊 완료자 명단(내 PC)</button>
  </div>

  <!-- Main Card -->
  <div class="container" id="quizCard">
    <div class="progress-bar" id="progressBar">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>

    <div id="quizContent">

    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 문제 및 정답 편집</h3>
        <button class="close-btn" onclick="closeModal('editModal')">&times;</button>
      </div>
      <div id="editForm"></div>

    </div>
  </div>

        <button class="close-btn" onclick="closeModal('listModal')">&times;</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>성함</th>
              <th>완료 시간</th>
            </tr>
          </thead>
          <tbody id="completedTableBody">
            <!-- Dynamic Users Loaded via JS -->
          </tbody>
        </table>
      </div>
      <div class="btn-group-modal">
        <button class="btn-submit" onclick="downloadCSV()" style="background: #059669;">엑셀(CSV) 다운로드</button>
        <button class="btn-submit btn-danger" onclick="clearCompletedList()">명단 초기화</button>
      </div>
    </div>
  </div>
