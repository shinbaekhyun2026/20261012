<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연수 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-image 0.5s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Admin Toolbar */
    .admin-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Progress Indicator */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--primary);
      transform: scale(1.2);
    }

    .step-dot.completed {
      background: var(--accent);
    }

    /* Card Content */
    h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    p.description {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .hint-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f59e0b;
      padding: 10px 15px;
      font-size: 0.9rem;
      color: #fde68a;
      text-align: left;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
    }

    /* Input & Button */
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-group-modal {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* Shake Animation for Wrong Answer */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: left;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    th {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Admin Controls -->
  <div class="admin-bar">
    <button class="admin-btn" onclick="openModal('listModal')">📊 완료자 명단(내 PC)</button>
  </div>

  <!-- Main Card -->
  <div class="container" id="quizCard">
    <div class="progress-bar" id="progressBar">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div id="quizContent">
      <!-- Dynamic Content Loaded via JS -->
    </div>
  </div>

  <!-- Completed Users Modal -->
  <div class="modal" id="listModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📊 완료자 명단 (로컬 저장소)</h3>
        <button class="close-btn" onclick="closeModal('listModal')">&times;</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>성함</th>
              <th>완료 시간</th>
            </tr>
          </thead>
          <tbody id="completedTableBody">
            <!-- Dynamic Users Loaded via JS -->
          </tbody>
        </table>
      </div>
      <div class="btn-group-modal">
        <button class="btn-submit" onclick="downloadCSV()" style="background: #059669;">엑셀(CSV) 다운로드</button>
        <button class="btn-submit btn-danger" onclick="clearCompletedList()">명단 초기화</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🚀 [신규 구글 앱스 스크립트 웹 앱 URL 적용]
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbySxegFvjQOnIPCz5VsK18OaxVpTmMpVAwjWVIU8Zd-jxjm-Rb7eu97mWc7P8fj0-M/exec";
    const ADMIN_PASSWORD = "4681";

    // 식행동 퀴즈 데이터 고정
    const questions = [
      {
        question: "1번 문제",
        desc: "청소년기 식행동 중 고열량 저영양의 원인이 되는 식행동은 무엇인가요?",
        hint: "💡 힌트: ㅈㅅㅅㅍㅅㅎ",
        answer: "즉석식품선호",
        bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80"
      },
      {
        question: "2번 문제",
        desc: "청소년기 뇌발달 저하와 폭식의 원인이 되는 식행동은 무엇인가요?",
        hint: "💡 힌트: ㅇㅊㄱㅅ",
        answer: "아침결식",
        bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80"
      },
      {
        question: "3번 문제",
        desc: "청소년기 저체중으로 면역력 저하의 원인이 되는 식행동은 무엇인가요?",
        hint: "💡 힌트: ㅁㄹ ㅎ ㄷ ㅇㅇㅌ",
        answer: "무리한다이어트",
        bg: "https://images.unsplash.com/photo-1510511459019-5dee997dd1db?auto=format&fit=crop&w=1200&q=80"
      }
    ];

    // 실행 시 구버전 로컬 문제 데이터 자동 삭제
    localStorage.removeItem('training_questions');

    let currentStep = 0;
    let userName = "";

    function init() {
      renderQuestionStep();
    }

    function renderQuestionStep() {
      const q = questions[currentStep];
      if (!q) return;

      document.body.style.backgroundImage = `url('${q.bg}')`;

      const dots = document.querySelectorAll('.step-dot');
      dots.forEach((dot, index) => {
        dot.className = 'step-dot';
        if (index < currentStep) dot.classList.add('completed');
        if (index === currentStep) dot.classList.add('active');
      });

      const quizContent = document.getElementById('quizContent');
      if (!quizContent) return;

      const nameBoxHtml = currentStep === 0 ? `
        <div style="text-align: left; margin-bottom: 15px;">
          <label style="font-size:0.85rem; color:#94a3b8; display:block; margin-bottom:5px;">👤 응답자 성함</label>
          <input type="text" id="userInputName" placeholder="성함을 입력하세요 (예: 홍길동)" value="${userName}">
        </div>
      ` : '';

      quizContent.innerHTML = `
        <h2>${q.question}</h2>
        <p class="description">${q.desc.replace(/\n/g, '<br>')}</p>
        ${q.hint ? `<div class="hint-box">${q.hint}</div>` : ''}
        ${nameBoxHtml}
        <div style="text-align: left;">
          <label style="font-size:0.85rem; color:#94a3b8; display:block; margin-bottom:5px;">✏️ 정답 입력</label>
          <input type="text" id="userAnswer" placeholder="정답을 입력하세요" autofocus onkeypress="if(event.key==='Enter') checkAnswer()">
        </div>
        <button class="btn-submit" onclick="checkAnswer()">정답 확인</button>
      `;
    }

    function checkAnswer() {
      if (currentStep === 0) {
        const nameInput = document.getElementById('userInputName');
        if (nameInput) {
          const val = nameInput.value.trim();
          if (!val) {
            alert("성함을 먼저 입력해 주세요!");
            nameInput.focus();
            return;
          }
          userName = val;
        }
      }

      const userAnsInput = document.getElementById('userAnswer');
      if (!userAnsInput) return;

      const userAns = userAnsInput.value.trim().replace(/\s+/g, '');
      const correctAns = questions[currentStep].answer.trim().replace(/\s+/g, '');

      if (userAns.toLowerCase() === correctAns.toLowerCase()) {
        currentStep++;
        if (currentStep < questions.length) {
          renderQuestionStep();
        } else {
          renderSuccessStep();
        }
      } else {
        const quizCard = document.getElementById('quizCard');
        if (quizCard) {
          quizCard.classList.add('shake');
          setTimeout(() => quizCard.classList.remove('shake'), 400);
        }
        alert("❌ 오답입니다! 다시 풀어보세요.");
      }
    }

    function renderSuccessStep() {
      saveCompletionRecord(userName);

      document.body.style.backgroundImage = `url('https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=80')`;
      
      const dots = document.querySelectorAll('.step-dot');
      dots.forEach(dot => dot.classList.add('completed'));

      const quizContent = document.getElementById('quizContent');
      if (!quizContent) return;

      quizContent.innerHTML = `
        <h2>🎉 연수 퀴즈 완료!</h2>
        <p class="description">축하합니다, <strong>${userName}</strong>님!<br>모든 퀴즈를 무사히 완료하고 연수를 완수하셨습니다.</p>
        <div style="font-size: 3rem; margin: 20px 0;">👏✨</div>
      `;
    }

    function saveCompletionRecord(name) {
      if (!name) return;

      try {
        let records = JSON.parse(localStorage.getItem('training_completed_users')) || [];
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        records.push({ name: name, time: timeStr });
        localStorage.setItem('training_completed_users', JSON.stringify(records));
      } catch (e) {
        console.error("로컬 저장 오류:", e);
      }

      let iframe = document.getElementById('gas_hidden_iframe');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.name = 'gas_hidden_iframe';
        iframe.id = 'gas_hidden_iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }

      const form = document.createElement('form');
      form.action = GAS_WEB_APP_URL;
      form.method = 'POST';
      form.target = 'gas_hidden_iframe';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'name';
      input.value = name;

      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();

      setTimeout(() => {
        if (form && form.parentNode) {
          document.body.removeChild(form);
        }
      }, 1000);
    }

    function openModal(modalId) {
      if (modalId === 'listModal') renderCompletedTable();
      const el = document.getElementById(modalId);
      if (el) el.style.display = 'flex';
    }

    function closeModal(modalId) {
      const el = document.getElementById(modalId);
      if (el) el.style.display = 'none';
    }

    function renderCompletedTable() {
      const tbody = document.getElementById('completedTableBody');
      if (!tbody) return;
      let records = [];
      try {
        records = JSON.parse(localStorage.getItem('training_completed_users')) || [];
      } catch (e) {
        records = [];
      }

      tbody.innerHTML = '';

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">아직 이 기기에서 완료한 기록이 없습니다.</td></tr>`;
        return;
      }

      records.forEach((rec, idx) => {
        tbody.innerHTML += `
          <tr>
            <td>${idx + 1}</td>
            <td>${rec.name}</td>
            <td>${rec.time}</td>
          </tr>
        `;
      });
    }

    function clearCompletedList() {
      const inputPassword = prompt("🔒 관리자 비밀번호를 입력하세요:");
      if (inputPassword === null) return;

      if (inputPassword === ADMIN_PASSWORD) {
        if (confirm("정말로 완료자 명단을 전체 삭제하시겠습니까? (복구할 수 없습니다)")) {
          localStorage.removeItem('training_completed_users');
          renderCompletedTable();
          alert("완료자 명단이 완전히 초기화되었습니다.");
        }
      } else {
        alert("❌ 비밀번호가 올바르지 않습니다.");
      }
    }

    function downloadCSV() {
      let records = [];
      try {
        records = JSON.parse(localStorage.getItem('training_completed_users')) || [];
      } catch (e) {
        records = [];
      }

      if (records.length === 0) {
        alert("다운로드할 데이터가 없습니다.");
        return;
      }

      let csvContent = "\uFEFF번호,성함,완료시간\n";
      records.forEach((rec, idx) => {
        csvContent += `${idx + 1},"${rec.name}","${rec.time}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "연수퀴즈_완료자_명단.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
