<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방탈출 연수 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-image 0.5s ease-in-out;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Admin Toolbar */
    .admin-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Progress Indicator */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--primary);
      transform: scale(1.2);
    }

    .step-dot.completed {
      background: var(--accent);
    }

    /* Card Content */
    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      word-break: keep-all;
    }

    p.description {
      font-size: 1rem;
      color: #cbd5e1;
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .hint-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f59e0b;
      padding: 10px 15px;
      font-size: 0.9rem;
      color: #fde68a;
      text-align: left;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
    }

    /* Input & Button */
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* Shake Animation for Wrong Answer */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: left;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .edit-group {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }

    .edit-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    th {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Admin Controls -->
  <div class="admin-bar">
    <button class="admin-btn" onclick="openModal('editModal')">⚙️ 문제 편집</button>
    <button class="admin-btn" onclick="openModal('listModal')">📊 완료자 명단</button>
  </div>

  <!-- Main Card -->
  <div class="container" id="quizCard">
    <div class="progress-bar" id="progressBar">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div id="quizContent">
      <!-- Dynamic Content Loaded via JS -->
    </div>
  </div>

  <!-- Edit Questions Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 문제 및 정답 편집</h3>
        <button class="close-btn" onclick="closeModal('editModal')">&times;</button>
      </div>
      <div id="editForm"></div>
      <button class="btn-submit" onclick="saveQuestions()" style="margin-top: 10px;">저장하기</button>
    </div>
  </div>

  <!-- Completed Users Modal -->
  <div class="modal" id="listModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📊 퀴즈 완료자 명단</h3>
        <button class="close-btn" onclick="closeModal('listModal')">&times;</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>이름/소속</th>
              <th>완료 시간</th>
            </tr>
          </thead>
          <tbody id="completedTableBody">
            <!-- Dynamic Users Loaded via JS -->
          </tbody>
        </table>
      </div>
      <button class="btn-submit" onclick="downloadCSV()" style="margin-top: 20px; background: #059669;">엑셀(CSV) 다운로드</button>
    </div>
  </div>

  <script>
    // Default Questions & Background Images
    let defaultQuestions = [
      {
        question: "1번 방: 연수 첫 번째 퀴즈",
        desc: "공직자가 직무 관련 공정하게 업무를 처리해야 하는 의무는 무엇일까요?",
        hint: "💡 힌트: ㄱㅇㅅ (3글자)",
        answer: "공정성",
        bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80"
      },
      {
        question: "2번 방: 이모지 암호 퀴즈",
        desc: "다음 이모지 조합이 뜻하는 여름철 용품은 무엇일까요?\n☀️ + 👓 = [ ? ]",
        hint: "💡 힌트: 4글자 단어입니다.",
        answer: "선글라스",
        bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80"
      },
      {
        question: "3번 방: 최종 탈출 퀴즈",
        desc: "청렴의 3대 요소 중 올바르지 않은 항목의 번호는?\n1. 투명성  2. 정직성  3. 은폐성  4. 공정성",
        hint: "💡 힌트: 숫자 1자리만 입력하세요.",
        answer: "3",
        bg: "https://images.unsplash.com/photo-1510511459019-5dee997dd1db?auto=format&fit=crop&w=1200&q=80"
      }
    ];

    let questions = JSON.parse(localStorage.getItem('escape_questions')) || defaultQuestions;
    let currentStep = -1; // -1: Name input step, 0~2: Questions
    let userName = "";

    const quizContent = document.getElementById('quizContent');
    const quizCard = document.getElementById('quizCard');

    // Initialize View
    function init() {
      renderNameInputStep();
    }

    // Step 0: User Name Input
    function renderNameInputStep() {
      document.body.style.backgroundImage = `url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80')`;
      quizContent.innerHTML = `
        <h2>🔒 방탈출 연수 퀴즈</h2>
        <p class="description">퀴즈에 참여하려면 성함(또는 소속)을 입력해 주세요.</p>
        <input type="text" id="userInputName" placeholder="예: 홍길동 (초등교육과)" autofocus>
        <button class="btn-submit" onclick="startQuiz()">방탈출 시작하기</button>
      `;
    }

    function startQuiz() {
      const nameInput = document.getElementById('userInputName').value.trim();
      if (!nameInput) {
        alert("성함이나 소속을 입력해 주세요!");
        return;
      }
      userName = nameInput;
      currentStep = 0;
      renderQuestionStep();
    }

    // Render Question Steps
    function renderQuestionStep() {
      const q = questions[currentStep];
      document.body.style.backgroundImage = `url('${q.bg}')`;

      // Update dots
      const dots = document.querySelectorAll('.step-dot');
      dots.forEach((dot, index) => {
        dot.className = 'step-dot';
        if (index < currentStep) dot.classList.add('completed');
        if (index === currentStep) dot.classList.add('active');
      });

      quizContent.innerHTML = `
        <h2>${q.question}</h2>
        <p class="description">${q.desc.replace(/\n/g, '<br>')}</p>
        ${q.hint ? `<div class="hint-box">${q.hint}</div>` : ''}
        <input type="text" id="userAnswer" placeholder="정답을 입력하세요" autofocus onkeypress="if(event.key==='Enter') checkAnswer()">
        <button class="btn-submit" onclick="checkAnswer()">정답 확인</button>
      `;
    }

    // Validate Answer
    function checkAnswer() {
      const userAns = document.getElementById('userAnswer').value.trim().replace(/\s+/g, '');
      const correctAns = questions[currentStep].answer.trim().replace(/\s+/g, '');

      if (userAns.toLowerCase() === correctAns.toLowerCase()) {
        currentStep++;
        if (currentStep < questions.length) {
          renderQuestionStep();
        } else {
          renderSuccessStep();
        }
      } else {
        quizCard.classList.add('shake');
        setTimeout(() => quizCard.classList.remove('shake'), 400);
        alert("❌ 오답입니다! 다시 풀어보세요.");
      }
    }

    // Success Screen & Save Winner
    function renderSuccessStep() {
      saveCompletionRecord(userName);

      document.body.style.backgroundImage = `url('https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=80')`;
      
      const dots = document.querySelectorAll('.step-dot');
      dots.forEach(dot => dot.classList.add('completed'));

      quizContent.innerHTML = `
        <h2>🎉 탈출 성공!</h2>
        <p class="description">축하합니다, <strong>${userName}</strong>님!<br>모든 퀴즈를 무사히 해결하고 연수를 완수하셨습니다.</p>
        <div style="font-size: 3rem; margin: 20px 0;">👏✨</div>
      `;
    }

    // LocalStorage Save Completion Data
    function saveCompletionRecord(name) {
      let records = JSON.parse(localStorage.getItem('escape_completed_users')) || [];
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      
      records.push({ name: name, time: timeStr });
      localStorage.setItem('escape_completed_users', JSON.stringify(records));
    }

    // Modal Control
    function openModal(modalId) {
      if (modalId === 'editModal') renderEditForm();
      if (modalId === 'listModal') renderCompletedTable();
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // Render Edit Modal Form
    function renderEditForm() {
      const container = document.getElementById('editForm');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        container.innerHTML += `
          <div class="edit-group">
            <h4>[${idx + 1}번 문제]</h4>
            <label>제목/방 이름</label>
            <input type="text" id="edit_title_${idx}" value="${q.question}">
            <label>문제 설명</label>
            <input type="text" id="edit_desc_${idx}" value="${q.desc}">
            <label>힌트 문구</label>
            <input type="text" id="edit_hint_${idx}" value="${q.hint}">
            <label>정답</label>
            <input type="text" id="edit_ans_${idx}" value="${q.answer}">
          </div>
        `;
      });
    }

    // Save Edited Questions
    function saveQuestions() {
      questions.forEach((q, idx) => {
        q.question = document.getElementById(`edit_title_${idx}`).value;
        q.desc = document.getElementById(`edit_desc_${idx}`).value;
        q.hint = document.getElementById(`edit_hint_${idx}`).value;
        q.answer = document.getElementById(`edit_ans_${idx}`).value;
      });

      localStorage.setItem('escape_questions', JSON.stringify(questions));
      alert("문제가 정상적으로 저장되었습니다!");
      closeModal('editModal');
      
      if (currentStep >= 0 && currentStep < questions.length) {
        renderQuestionStep();
      }
    }

    // Render Completed Users Table
    function renderCompletedTable() {
      const tbody = document.getElementById('completedTableBody');
      const records = JSON.parse(localStorage.getItem('escape_completed_users')) || [];
      tbody.innerHTML = '';

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">아직 완료자가 없습니다.</td></tr>`;
        return;
      }

      records.forEach((rec, idx) => {
        tbody.innerHTML += `
          <tr>
            <td>${idx + 1}</td>
            <td>${rec.name}</td>
            <td>${rec.time}</td>
          </tr>
        `;
      });
    }

    // Export Data to CSV
    function downloadCSV() {
      const records = JSON.parse(localStorage.getItem('escape_completed_users')) || [];
      if (records.length === 0) {
        alert("다운로드할 데이터가 없습니다.");
        return;
      }

      let csvContent = "\uFEFF번호,이름/소속,완료시간\n";
      records.forEach((rec, idx) => {
        csvContent += `${idx + 1},"${rec.name}","${rec.time}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "방탈출_완료자_명단.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    init();
  </script>
</body>
</html>
